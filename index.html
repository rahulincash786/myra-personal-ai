<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>MYRA Personal AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 35%,#17234b,#080b16 60%);color:#f4f6ff;font-family:Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;min-height:100vh;padding:25px 22px;display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:23px;font-weight:bold;letter-spacing:4px}
.status{font-size:12px;color:#9ba9ce}
h1{font-size:27px;margin:65px 0 8px}
#state{color:#aeb9dc;font-size:14px}
.orb{margin:45px 0;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#a8c5ff,#6557ec 35%,#101a45 70%);box-shadow:0 0 35px #625afc,0 0 90px #283ea8;transition:.25s}
.orb.listening{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 65px #8a70ff}}
.orb span{font-size:52px}
#reply{width:100%;min-height:70px;padding:17px;border:1px solid #27365d;border-radius:16px;background:#10172a;text-align:center;line-height:1.5;color:#e0e7ff}
.controls{display:flex;gap:15px;margin:25px 0}
button{border:0;border-radius:30px;padding:15px 23px;font-weight:bold;cursor:pointer}
#talk{background:#7d76ff;color:white}
#stop{background:#202a43;color:#e4e9ff}
.note{font-size:12px;color:#98a4c5;text-align:center;line-height:1.6;margin-top:auto;padding-top:28px}
</style>
</head>
<body>
<main>
<header><div class="brand">MYRA</div><div class="status">PERSONAL AI · BETA</div></header>
<h1>Hello, Rahul</h1>
<div id="state">Tap the microphone to speak</div>
<div class="orb" id="orb"><span>✦</span></div>
<div id="reply">I’m ready to listen to you.</div>
<div class="controls"><button id="talk">🎙 Speak</button><button id="stop">Stop</button></div>
<div class="note">Voice recognition depends on browser and internet support.<br>AI replies will be connected in the next setup step.</div>
</main>
<script>
const API_URL = "https://myra-rahul-ai.rahulislam0342.workers.dev";

const state = document.getElementById("state");
const reply = document.getElementById("reply");
const orb = document.getElementById("orb");

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

function say(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = /[\u0900-\u097F]/.test(text) ? "hi-IN" : "en-IN";
  window.speechSynthesis.speak(utterance);
}

async function askMYRA(message) {
  state.textContent = "MYRA is thinking...";
  reply.textContent = "You said: " + message;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed: " + response.status);
    }

    if (!data.reply) {
      throw new Error("MYRA did not return a reply.");
    }

    reply.textContent = data.reply;
    state.textContent = "MYRA is ready to listen to you.";
    say(data.reply);
  } catch (error) {
    reply.textContent = "Connection error: " + error.message;
    state.textContent = "Please try again.";
  }
}

document.getElementById("talk").onclick = () => {
  if (!SR) {
    state.textContent = "Voice recognition unavailable";
    reply.textContent = "Please try Google Chrome.";
    return;
  }

  if (recognition) {
    try { recognition.abort(); } catch (e) {}
  }

  recognition = new SR();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    state.textContent = "Listening...";
    orb.classList.add("listening");
  };

  recognition.onend = () => {
    orb.classList.remove("listening");
  };

  recognition.onerror = (event) => {
    orb.classList.remove("listening");
    state.textContent = "Microphone error";
    reply.textContent = "Please check microphone permission and try again. " + event.error;
  };

  recognition.onresult = (event) => {
    const message = event.results[0][0].transcript;
    askMYRA(message);
  };

  try {
    recognition.start();
  } catch (error) {
    state.textContent = "Please tap Speak again.";
  }
};

document.getElementById("stop").onclick = () => {
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  orb.classList.remove("listening");
  state.textContent = "MYRA stopped.";
};
</script>
 
</body>
</html>
